services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mykom
      POSTGRES_PASSWORD: mykom
      POSTGRES_DB: mykom
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mykom -d mykom']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
